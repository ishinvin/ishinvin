<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" role="img" aria-label="Animated terminal: Ishin Vin, software developer. I code. I break. I fix. I commit. Repeat.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="50%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#6DB33F"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Typing reveal masks. Loop length 14s. Char width at 16px monospace ~ 9.6px -->
    <clipPath id="c1"><rect x="40" y="84" height="24" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.036;0.107;0.95;1" values="0;0;77;77;0"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="112" height="24" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.13;0.25;0.95;1" values="0;0;413;413;0"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="152" height="24" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.285;0.357;0.95;1" values="0;0;144;144;0"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="180" height="24" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.37;0.535;0.95;1" values="0;0;605;605;0"/></rect></clipPath>
    <clipPath id="c5"><rect x="40" y="220" height="24" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.57;0.75;0.95;1" values="0;0;374;374;0"/></rect></clipPath>
    <clipPath id="c6"><rect x="40" y="248" height="24" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.77;0.89;0.95;1" values="0;0;538;538;0"/></rect></clipPath>
  </defs>

  <style>
    text { font-family: 'Fira Code','JetBrains Mono','Courier New',monospace; font-size: 16px; }
    .p  { fill: #3fb950; }
    .c  { fill: #e6edf3; }
    .o  { fill: #58a6ff; }
    .s  { fill: #d2a8ff; }
    .m  { fill: #8b949e; }
    .cursor { fill: #3fb950; animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
  </style>

  <!-- Window -->
  <rect x="2" y="2" width="816" height="336" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="816" height="4" rx="2" fill="url(#accent)"/>

  <!-- Title bar -->
  <circle cx="28" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="26" r="6" fill="#27c93f"/>
  <text x="410" y="31" text-anchor="middle" class="m" style="font-size:13px">ishinvin@github: ~</text>
  <line x1="2" y1="46" x2="818" y2="46" stroke="#30363d"/>

  <!-- Floating dots -->
  <g fill="#58a6ff" opacity="0.5" filter="url(#glow)">
    <circle cx="760" cy="90" r="2"><animate attributeName="cy" values="90;70;90" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="785" cy="140" r="1.5" fill="#d2a8ff"><animate attributeName="cy" values="140;165;140" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="200" r="2" fill="#3fb950"><animate attributeName="cy" values="200;180;200" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="772" cy="260" r="1.5"><animate attributeName="cy" values="260;285;260" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Line 1 -->
  <g clip-path="url(#c1)">
    <text x="40" y="102"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text>
  </g>
  <!-- Line 2 -->
  <g clip-path="url(#c2)">
    <text x="40" y="130" class="o">Ishin Vin · Software Developer · Phnom Penh</text>
  </g>
  <!-- Line 3 -->
  <g clip-path="url(#c3)">
    <text x="40" y="170"><tspan class="p">$ </tspan><tspan class="c">cat stack.txt</tspan></text>
  </g>
  <!-- Line 4 -->
  <g clip-path="url(#c4)">
    <text x="40" y="198" class="s">Spring Boot · Go · TypeScript · Vue · Node.js · Python · Kotlin</text>
  </g>
  <!-- Line 5 -->
  <g clip-path="url(#c5)">
    <text x="40" y="238"><tspan class="p">$ </tspan><tspan class="c">git commit -m </tspan><tspan class="o">"learn. build. repeat."</tspan></text>
  </g>
  <!-- Line 6 -->
  <g clip-path="url(#c6)">
    <text x="40" y="266" class="m">[main 4f2a9c1] I code. I break. I fix. I commit. Repeat.</text>
  </g>

  <!-- Prompt + cursor -->
  <text x="40" y="308" class="p">$ </text>
  <rect class="cursor" x="58" y="294" width="10" height="18"/>
</svg>
